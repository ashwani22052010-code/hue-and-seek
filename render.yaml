# One-click deploy on Render (https://render.com): New -> Blueprint -> pick this repository.
# Creates the game web service (WebSockets supported) and a PostgreSQL database.
services:
  - type: web
    name: hue-and-seek
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: hue-and-seek-db
          property: connectionString

databases:
  - name: hue-and-seek-db
    plan: free
